name: Release

# Pushing a version tag builds the Windows installer and publishes it to a new
# public GitHub Release. Nothing here runs on ordinary pushes — a release is an
# explicit act, and tagging is the signal.
on:
  push:
    tags:
      - "v*.*.*"
  # Lets a failed publish be retried, or a build be produced for inspection,
  # without inventing a throwaway tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` respects the lockfile exactly, so the released binary is built
      # from the same dependency tree that was tested locally.
      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION."
            echo "electron-builder names artifacts from package.json, so these must agree."
            exit 1
          fi
          echo "Building $VERSION"

      # Typecheck before packaging: a broken build is worth catching here rather
      # than in an installer someone has already downloaded.
      - name: Typecheck
        run: npm run typecheck

      # Compile main, preload and renderer into out/ BEFORE packaging.
      # electron-builder only packs what already exists — locally this is the
      # first half of `npm run dist`; without it the app.asar has no entry file
      # and packaging fails with "out/main/index.js was not found".
      - name: Build
        run: npm run build

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A copy that outlives a failed publish, so a green build is never lost to
      # a transient release-API error.
      - name: Upload installer as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: praxisos-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: ignore
          retention-days: 14
